// ---- Equitable exposure ------------------------------------------------------
// Ranking is a rotation, not a popularity contest: priority band first, then fewest views, with an org cap and a reserved slot.
function rankFeed(list) {
  const open = list.filter(l => l.status === 'Open'), matched = list.filter(l => l.status !== 'Open');
  const avg = open.length ? open.reduce((a, l) => a + (l.views||0), 0) / open.length : 0;
  const band = l => l.kind === 'Need' ? URG.indexOf(l.urgency) : 1;   // offers sit with P2
  const sorted = open.slice().sort((a, b) => band(b) - band(a) || (a.views||0) - (b.views||0) || new Date(b.createdAt) - new Date(a.createdAt));
  const out = [], perOrg = {}, deferred = [];
  for (const l of sorted) { const c = perOrg[l.ein] || 0; if (out.length < 6 && c >= 2) { deferred.push(l); continue; } perOrg[l.ein] = c + 1; out.push(l); }
  // Reserve slot 3 for the least-seen open listing not already in the top 3.
  const leastSeen = open.slice().sort((a, b) => (a.views||0) - (b.views||0) || new Date(a.createdAt) - new Date(b.createdAt))[0];
  if (leastSeen && out.length > 3 && !out.slice(0, 3).includes(leastSeen)) { out.splice(out.indexOf(leastSeen), 1); out.splice(2, 0, leastSeen); }
  const all = out.concat(deferred, matched);
  return all.map((l, i) => {
    const v = l.views || 0; let why;
    if (l.status !== 'Open') why = l.status === 'Matched' ? 'matched — shown for context' : '';
    else if (i === 2 && l === leastSeen) why = 'fair-rotation slot: seen least of anything open';
    else if (l.kind === 'Need' && l.urgency === 'Critical') why = 'P0 — always on top';
    else if (v < avg * 0.6) why = `seen ${v}× — below the ${Math.round(avg)}× average, so it rises`;
    else if (deferred.includes(l)) why = 'org already has 2 in the top 6';
    else why = `${l.kind === 'Need' ? PRI[l.urgency][0] : 'offer'} · seen ${v}×`;
    return { l, why };
  });
}
function countViews() { // called when the Board is opened: the first 6 shown get a view
  for (const r of rankFeed(S.listings.filter(l => listingPasses(l))).slice(0, 6)) if (r.l.status === 'Open') r.l.views = (r.l.views || 0) + 1;
}

// ---- Map: view (pan/zoom) --------------------------------------------------
const MAP_W = 620, MAP_H = 400, K_MIN = 1, K_MAX = 40;
let mapUpp = 620 / 345; // map units per CSS pixel; measured after each render so sizes stay constant on screen
// Miles per viewBox unit at zoom 1, measured along a parallel through the middle of the state.
const MILES_PER_UNIT = (124.95 - 116.75) * 69.17 * Math.cos(47.3 * Math.PI / 180) / MAP_W;
function clampView(v){
  v.k = Math.min(K_MAX, Math.max(K_MIN, v.k));
  if (v.k === 1) { v.tx = 0; v.ty = 0; return v; }
  const pad = 60;
  v.tx = Math.min(pad, Math.max(MAP_W * (1 - v.k) - pad, v.tx));
  v.ty = Math.min(pad, Math.max(MAP_H * (1 - v.k) - pad, v.ty));
  return v;
}
function zoomAt(v, f, ux, uy){ const k2 = Math.min(K_MAX, Math.max(K_MIN, v.k * f)); f = k2 / v.k; v.tx = ux - (ux - v.tx) * f; v.ty = uy - (uy - v.ty) * f; v.k = k2; return clampView(v); }
function fitView(v, pts){ // pts: [{lat,lon}] → zoom so they all fit with margin
  if (!pts.length) { v.k = 1; v.tx = 0; v.ty = 0; return v; }
  const xs = pts.map(o => PROJ.x(o.lon)), ys = pts.map(o => PROJ.y(o.lat));
  const w = Math.max(...xs) - Math.min(...xs) + 90, h = Math.max(...ys) - Math.min(...ys) + 90;
  v.k = Math.min(K_MAX, Math.max(K_MIN, Math.min(MAP_W / w, MAP_H / h)));
  const cx = (Math.max(...xs) + Math.min(...xs)) / 2, cy = (Math.max(...ys) + Math.min(...ys)) / 2;
  v.tx = MAP_W / 2 - cx * v.k; v.ty = MAP_H / 2 - cy * v.k; return clampView(v);
}
function applyView(){ const g = document.getElementById('mapg'); if (g) g.setAttribute('transform', `translate(${S.map.tx.toFixed(2)} ${S.map.ty.toFixed(2)}) scale(${S.map.k.toFixed(4)})`); }
function scaleBar(k){
  const target = 80 * mapUpp / k * MILES_PER_UNIT; // want a bar ~80 CSS px wide
  const nice = [0.25, 0.5, 1, 2, 5, 10, 20, 25, 50, 100, 200].reduce((best, m) => Math.abs(m - target) < Math.abs(best - target) ? m : best, 1);
  const len = nice / MILES_PER_UNIT * k, u = mapUpp;
  return `<g transform="translate(${(12*u).toFixed(1)} ${(MAP_H - 12*u).toFixed(1)})"><line class="scaleline" vector-effect="non-scaling-stroke" x1="0" y1="0" x2="${len.toFixed(1)}" y2="0"/><line class="scaleline" vector-effect="non-scaling-stroke" x1="0" y1="${(-4*u).toFixed(1)}" x2="0" y2="${(4*u).toFixed(1)}"/><line class="scaleline" vector-effect="non-scaling-stroke" x1="${len.toFixed(1)}" y1="${(-4*u).toFixed(1)}" x2="${len.toFixed(1)}" y2="${(4*u).toFixed(1)}"/><text class="scalebar" style="font-size:${(10*u).toFixed(2)}px" x="${(len/2).toFixed(1)}" y="${(-6*u).toFixed(1)}" text-anchor="middle">${nice} mi</text></g>`;
}

// ---- Map: filters + the golden thread ------------------------------------
const degreeOf = ein => S.matches.filter(m => !['Declined','Cancelled'].includes(m.status) && [S.listings.find(l=>l.id===m.need).ein, S.listings.find(l=>l.id===m.offer).ein].includes(ein)).length;
function renderMap(){
  clampView(S.map); const k = S.map.k, inv = 1 / k;
  const px = n => n * mapUpp * inv;   // n CSS pixels → map units under the current transform
  const f = S.filter, v = S.map, mine = me();
  const listingOk = l => listingPasses(l, f);
  const visible = new Set(S.listings.filter(listingOk).map(l=>l.ein));
  const inRadius = o => !f.radius || MILES(mine, o) <= f.radius;
  const matchOk = m => { const n=S.listings.find(l=>l.id===m.need), o=S.listings.find(l=>l.id===m.offer); if (!n||!o||m.status==='Declined'||m.status==='Cancelled') return false;
    if (!f.threads[m.status]) return false;
    const ends=[ORG(n.ein),ORG(o.ein)]; return (!f.category || n.category===f.category) && (f.who==='All' || ends.some(e=>e.type===f.who)) && ends.some(inRadius); };
  const threads = S.matches.filter(matchOk);
  const suggested = f.threads.suggested ? S.listings.filter(l=>l.kind==='Need'&&l.status==='Open'&&listingOk(l)).map(n=>{ const best=suggestions(n)[0]; return best ? { need:n, offer:best.l, s:best.s } : null; }).filter(Boolean) : [];
  const path = 'M' + WA_OUTLINE.map(([lon,lat]) => PROJ.x(lon).toFixed(1)+','+PROJ.y(lat).toFixed(1)).join(' L') + ' Z';
  const endsOf = m => [S.listings.find(l=>l.id===m.need).ein, S.listings.find(l=>l.id===m.offer).ein];
  const onSet = new Set(ORGS.filter(o => visible.has(o.ein) || threads.some(m => endsOf(m).includes(o.ein))).map(o => o.ein));

  // ---- Clustering: pins that would sit within ~30 screen px of each other merge into one node; zooming in splits them.
  const nodes = [], nodeOf = {};
  const ordered = ORGS.slice().sort((a,b) => (onSet.has(b.ein)-onSet.has(a.ein)) || (degreeOf(b.ein)-degreeOf(a.ein)));
  for (const o of ordered) { const x = PROJ.x(o.lon), y = PROJ.y(o.lat);
    let n = k < 36 ? nodes.find(c => Math.hypot(c.x - x, c.y - y) < px(30)) : null;
    if (!n) { n = { id:'c'+nodes.length, x, y, members:[], on:0, deg:0 }; nodes.push(n); }
    n.members.push(o); n.on += onSet.has(o.ein) ? 1 : 0; n.deg += degreeOf(o.ein); nodeOf[o.ein] = n; }
  for (const n of nodes) { n.x = n.members.reduce((a,o)=>a+PROJ.x(o.lon),0)/n.members.length; n.y = n.members.reduce((a,o)=>a+PROJ.y(o.lat),0)/n.members.length;
    n.single = n.members.length === 1; n.sel = n.single && v.sel === n.members[0].ein; n.mine = n.members.some(o => o.ein === mine.ein);
    const cities = [...new Set(n.members.map(o => o.city))]; const anchor = n.members[0].name.replace(/ \(.*\)$/, '');
    n.label = n.single ? anchor : (k >= 2 ? `${anchor} +${n.members.length - 1}` : (cities.length === 1 ? cap(cities[0]) : cap(cities[0]) + ' area') + ` · ${n.members.length} orgs`); }

  // ---- Threads: gently curved strings between nodes. Dash drifts giver → receiver.
  const dash = { Completed:[14, 7], Accepted:[9, 7], Proposed:[5, 8], suggested:[2, 7] };
  const thread = (aEin, bEin, st, extra='', title='') => { const a = nodeOf[aEin], b = nodeOf[bEin]; if (!a || !b || a === b) return '';
    const x1=a.x, y1=a.y, x2=b.x, y2=b.y, dx=x2-x1, dy=y2-y1, d=Math.hypot(dx,dy)||1, bend=Math.min(d*0.16, px(36)); const cx=(x1+x2)/2 - dy/d*bend, cy=(y1+y2)/2 + dx/d*bend;
    const [on, off] = dash[st] || [9,7]; const hi = /\bhi\b/.test(extra) ? 1 : 0;
    return `<path class="thread ${st}${hi?' hi':''}" style="stroke-width:${px(hi?3:st==='Completed'?2.2:1.6).toFixed(3)}px;stroke-dasharray:${px(on).toFixed(2)} ${px(off).toFixed(2)};--dash:${px(on+off).toFixed(2)}px" d="M${x1.toFixed(1)},${y1.toFixed(1)} Q${cx.toFixed(1)},${cy.toFixed(1)} ${x2.toFixed(1)},${y2.toFixed(1)}" ${extra.replace(/\bhi\b/,'')}><title>${esc(title)}</title></path>`; };
  const defs = `<defs><filter id="heatblur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="${px(7).toFixed(2)}"/></filter></defs>`;

  // ---- Labels: greedy placement by priority; overlapping ones wait for zoom or hover.
  const placed = [];
  const labelFits = (x, y, name, size, r = px(10)) => { const w = px(size * 0.58) * name.length + px(6), h = px(size + 3); const box = { x1: x + r + px(5), y1: y - h/2, x2: x + r + px(5) + w, y2: y + h/2 };
    if (placed.some(b => !(box.x2 < b.x1 || box.x1 > b.x2 || box.y2 < b.y1 || box.y1 > b.y2))) return false; placed.push(box); return true; };
  const nodeOrder = nodes.slice().sort((a, b) => (b.sel - a.sel) || (b.on - a.on) || (b.deg - a.deg) || (b.members.length - a.members.length));
  for (const n of nodes) { const r = n.single ? px(5.5 + Math.min(4, n.deg)) : px(9 + 3.5 * Math.sqrt(n.members.length)); placed.push({ x1: n.x - r, y1: n.y - r, x2: n.x + r, y2: n.y + r }); }
  const labelOk = new Set();
  for (const n of nodeOrder) { if ((n.on || !n.single) && (k >= 4 || n.sel || !n.single) && labelFits(n.x, n.y, n.label, n.single ? 13 : 11, n.single ? px(5.5 + Math.min(4, n.deg)) : px(9 + 3.5 * Math.sqrt(n.members.length)))) labelOk.add(n.id); }

  const pins = nodeOrder.slice().reverse().map(n => {
    const o = n.single ? n.members[0] : null, on = n.on > 0, r = n.single ? px(5.5 + Math.min(4, n.deg)) : px(9 + 3.5 * Math.sqrt(n.members.length));
    const type = n.single ? o.type : (n.members.filter(m=>m.type==='nonprofit').length >= n.members.length/2 ? 'nonprofit' : n.members[0].type);
    const heat = (n.deg > 0 || !n.single) ? `<circle class="heat ${n.deg>=3?'hot':''}" filter="url(#heatblur)" cx="${n.x.toFixed(2)}" cy="${n.y.toFixed(2)}" r="${(r + px(6 + 3*Math.sqrt(n.deg+n.members.length))).toFixed(3)}"/>` : '';
    return `<g class="org ${n.single?'':'cluster'} ${on?'':'dim'} ${n.sel?'sel':''}" style="--deg:${(1 + 0.3 * Math.min(6, n.deg)).toFixed(2)}" data-a="${n.single?'map-pin':'map-cluster'}" data-id="${n.single?o.ein:n.id}" data-members="${n.members.map(m=>m.ein).join(',')}">
      ${heat}<circle class="hit" cx="${n.x.toFixed(2)}" cy="${n.y.toFixed(2)}" r="${(r + px(8)).toFixed(3)}"/>
      <circle class="pin ${type} ${on?'':'dim'} ${n.mine?'me':''} ${n.sel?'sel':''}" vector-effect="non-scaling-stroke" cx="${n.x.toFixed(2)}" cy="${n.y.toFixed(2)}" r="${r.toFixed(3)}"/>
      ${n.single ? '' : `<text class="cnt" style="font-size:${px(11).toFixed(3)}px" x="${n.x.toFixed(2)}" y="${(n.y + px(4)).toFixed(2)}">${n.members.length}</text>`}
      <text class="${labelOk.has(n.id) ? '' : 'hoveronly'}" style="font-size:${px(n.single?13:11).toFixed(3)}px;stroke-width:${px(3.5).toFixed(3)}px" x="${(n.x + r + px(5)).toFixed(2)}" y="${(n.y + px(4.5)).toFixed(2)}">${esc(n.label)}</text></g>`; }).join('');

  const radius = f.radius ? `<ellipse class="radius" vector-effect="non-scaling-stroke" cx="${PROJ.x(mine.lon).toFixed(1)}" cy="${PROJ.y(mine.lat).toFixed(1)}" rx="${(f.radius/69/Math.cos(mine.lat*Math.PI/180)/(124.95-116.75)*620).toFixed(1)}" ry="${(f.radius/69/(49.1-45.45)*400).toFixed(1)}"/>` : '';
  const bigCities = k >= 2 ? Object.keys(CITY) : ['SEATTLE','TACOMA','SPOKANE','BELLINGHAM','OLYMPIA','PULLMAN','TOPPENISH'];
  const labels = k >= 6 ? '' : Object.entries(CITY).filter(([c,[lat,lon]]) => bigCities.includes(c) && !nodes.some(n => Math.hypot(n.x - PROJ.x(lon), n.y - PROJ.y(lat)) < px(34))).map(([c,[lat,lon]]) => `<text class="citylbl" style="font-size:${px(10).toFixed(3)}px" x="${(PROJ.x(lon)+px(8)).toFixed(1)}" y="${(PROJ.y(lat)-px(8)).toFixed(1)}">${cap(c)}</text>`).join('');
  const svg = `<svg id="mapsvg" viewBox="0 0 620 400" role="img" aria-label="Map of Washington with organizations and connections">${defs}<rect class="water" width="620" height="400"/>
    <g id="mapg" transform="translate(${S.map.tx.toFixed(2)} ${S.map.ty.toFixed(2)}) scale(${k.toFixed(4)})"><path class="land" vector-effect="non-scaling-stroke" d="${path}"/>${radius}${labels}
    ${suggested.map(x => thread(x.offer.ein, x.need.ein, 'suggested', '', `Suggested: ${ORG(x.offer.ein).name} \u2192 ${ORG(x.need.ein).name}`)).join('')}
    ${threads.map(m => { const n=S.listings.find(l=>l.id===m.need), o=S.listings.find(l=>l.id===m.offer); return thread(o.ein, n.ein, m.status, `data-a="map-thread" data-id="${m.id}"${v.selMatch===m.id?' hi':''}`, `${ORG(o.ein).name} \u2192 ${ORG(n.ein).name} \u00b7 ${n.category} \u00b7 ${m.status}${m.agreement?' \u00b7 \u21bb '+m.agreement.cadence:''}`); }).join('')}
    ${pins}</g>${scaleBar(k)}</svg>
    <div class="zoomctl"><button data-a="map-zoom" data-v="in" aria-label="Zoom in">+</button><button data-a="map-zoom" data-v="out" aria-label="Zoom out">−</button><button class="fit" data-a="map-zoom" data-v="fit" aria-label="Fit whole state">WA</button></div>
    <div class="maphint">${k > 1.05 ? Math.round(k*10)/10 + '× · drag to pan' : 'pinch or scroll to zoom'}</div>`;

  const done = threads.filter(m=>m.status==='Completed').length, active = threads.filter(m=>m.status!=='Completed').length;
  let detail = '';
  if (v.sel) { const o = ORG(v.sel); const ls = S.listings.filter(l=>l.ein===o.ein && listingOk(l)); const ms = S.matches.filter(m=>matchOk(m) && [S.listings.find(l=>l.id===m.need).ein, S.listings.find(l=>l.id===m.offer).ein].includes(o.ein)); const deg = degreeOf(o.ein);
    detail = `<div class="card"><span class="t" style="margin-top:0">${esc(o.name)}</span><span class="m">${cap(o.city)} · ${o.type==='nonprofit'?CAUSES[o.cause]:o.type==='business'?'Business':'Community member'}${mine.ein!==o.ein?` · ${Math.round(MILES(mine,o))} mi from you`:''} · ${deg} connection${deg===1?'':'s'}</span>
      ${ls.map(l=>`<span class="m"><span class="pill ${l.kind.toLowerCase()}">${l.kind.toUpperCase()}</span> ${esc(l.title)}</span>`).join('')||'<span class="m hint">No listings match the current filters.</span>'}
      ${ms.map(m=>{ const n=S.listings.find(l=>l.id===m.need), of=S.listings.find(l=>l.id===m.offer); const giving = of.ein===o.ein; const other = ORG(giving?n.ein:of.ein); return `<span class="m">${giving?'→ gives to':'← receives from'} <b>${esc(other.name)}</b> · ${n.category} · ${m.status}</span>`; }).join('')}
      <div class="row" style="margin-top:8px">${o.type==='nonprofit'?`<button class="btn sm" data-a="go" data-s="org" data-id="${o.ein}">Profile</button>`:''}${ls[0]?`<button class="btn sm primary" data-a="go" data-s="listing" data-id="${ls[0].id}">Open listing</button>`:''}</div></div>`; }
  else if (v.selMatch) { const m = S.matches.find(x=>x.id===v.selMatch); if (m) { const n=S.listings.find(l=>l.id===m.need), o=S.listings.find(l=>l.id===m.offer); const party = [n.ein,o.ein].includes(mine.ein);
    detail = `<div class="card"><span class="pill ${m.status==='Completed'?'ok':'need'}">${m.status}</span> <span class="pill grey">${n.category}</span><span class="t">${esc(ORG(o.ein).name)} → ${esc(ORG(n.ein).name)}</span><span class="m">gives "${esc(o.title)}" for "${esc(n.title)}" · ${Math.round(MILES(ORG(n.ein),ORG(o.ein)))} mi${m.agreement?` · ↻ ${m.agreement.cadence} since ${new Date(m.agreement.since).toLocaleDateString(undefined,{month:'short',year:'numeric'})}, ${m.agreement.occurrences.length} logged`:''}${m.doneAt?' · completed '+ago(m.doneAt):''}</span>${party?`<button class="btn sm primary" style="margin-top:8px" data-a="go" data-s="match" data-id="${m.id}">Open thread</button>`:'<span class="m hint">Details are private to the two organizations.</span>'}</div>`; } }

  return `${topbar()}<div class="screen"><h2 class="h">Map</h2><p class="sub">${done} completed · ${active} in progress · ${visible.size-1} with matching listings</p>
    <div class="map">${svg}</div>
    <div class="legend"><span><i style="background:var(--offer)"></i>nonprofit</span><span><i style="background:#3B5BA9"></i>business</span><span><i style="background:#7A5CA8"></i>community member</span><span><b style="border-color:#D9A12B;border-top-width:3px"></b>completed</span><span><b style="border-color:var(--offer)"></b>in progress</span><span><b class="dashed" style="border-color:var(--need)"></b>proposed</span><span><b class="dotted" style="border-color:var(--ink-3)"></b>suggested</span><span>the dash drifts from giver to receiver — hover or tap a thread to see it clearly · numbered circles are clusters: tap to zoom in · glow = activity</span></div>
    ${detail}
    <div class="flt-head"><span>Filters apply to the Board too</span></div>
    ${filterBlock(true)}
    <div class="label">Connections (${threads.length})</div>
    ${threads.slice().sort((a,b)=>new Date(b.doneAt||b.at)-new Date(a.doneAt||a.at)).map(m => { const n=S.listings.find(l=>l.id===m.need), o=S.listings.find(l=>l.id===m.offer); return `<button class="card tap ${v.selMatch===m.id?'sel':''}" data-a="map-focus" data-id="${m.id}"><span class="conn"><span><span class="from">${esc(ORG(o.ein).name.replace(/ \(.*\)$/, ''))}</span> <span class="arrow">→</span> <span class="to">${esc(ORG(n.ein).name.replace(/ \(.*\)$/, ''))}</span></span><span class="pill ${m.status==='Completed'?'ok':m.status==='Proposed'?'need':'grey'}">${m.status}</span><span class="m">${n.category} · ${esc(o.title)}${m.agreement?` · ↻ ${m.agreement.cadence}, ${m.agreement.occurrences.length} logged`:''} · ${Math.round(MILES(ORG(n.ein),ORG(o.ein)))} mi</span></span></button>`; }).join('') || '<div class="hint">No connections match these filters.</div>'}
    <p class="hint">Pinch or scroll to zoom (up to 40×), drag to pan, double-tap to zoom in; the bar shows miles at the current zoom. Pins sit at each organization’s ZIP code, so placement is neighborhood-accurate, not door-accurate. Tap a pin for an organization (hover grows it by its number of connections); tap a thread or a row below for a connection. Gold lines are completed hand-offs — the thread of help between groups. Business and community-member pins are examples, not real accounts. Organization locations: IRS Business Master File posted 2026-09-08 · refreshed monthly.</p></div>${tabs('map')}`;
}

document.addEventListener('click', async e => {
  const el = e.target.closest('[data-a]'); if (!el) return;
  const a = el.dataset.a, id = el.dataset.id;
  const guideAction = ['guide-toggle','step','prev','next','play','reset'].includes(a);
  const wasDone = guideAction ? true : STEPS[S.step].done();
  if (!guideAction) setTimeout(() => { syncStep(wasDone); render(); }, 0);
  const read = () => { const g = i => document.getElementById(i); if (S.screen==='post' && g('d-title')) S.draft = { ...S.draft, title:g('d-title').value, category:g('d-category').value, cadence:g('d-cadence')?g('d-cadence').value:'One-time', urgency:g('d-urgency')?g('d-urgency').value:'Normal', qty:g('d-qty').value, unit:g('d-unit').value, desc:g('d-desc').value, tags:g('d-tags').value }; if (S.screen==='orgs' && g('orgq')) S.orgFilter = { ...S.orgFilter, q:g('orgq').value, cause:g('cause').value, city:g('city').value }; if (S.screen==='claim' && g('claimq')) S.claimQuery = g('claimq').value; if (S.screen==='signup' && g('email')) S.signup.email = g('email').value; };
  switch (a) {
    case 'guide-toggle': S.guideMin = !S.guideMin; document.getElementById('guide').classList.toggle('min', S.guideMin); render(); document.getElementById('guide').classList.toggle('min', S.guideMin); return;
    case 'step': setStep(+el.dataset.i); break;
    case 'prev': S.step = Math.max(0, S.step-1); S.sheet = null; save(); render(); return;
    case 'next': setStep(S.step+1); return;
    case 'play': await playStep(); return;
    case 'reset': if (confirm('Reset the demo to the beginning?')) { S = fresh(); ORGS.forEach(o=>{o.verified=false;}); setStep(0); } return;
    case 'go': read(); go(el.dataset.s, id ? (isNaN(+id)?id:+id) : undefined); return;
    case 'signup-google': S.signup = { google:true, email:'casey@ballardfoodbank.org' }; go('role'); return;
    case 'signup-email': read(); if (!S.signup.email) { toast('Enter an email (try casey@ballardfoodbank.org)'); return; } go('role'); return;
    case 'role': S.signup.role = el.dataset.k; render(); return;
    case 'role-continue': if (S.signup.role==='np') go('claim'); else if (!S.signup.role) toast('Pick one to continue'); else render(); return;
    case 'claim-pick': read(); S.claimPick = id; render(); return;
    case 'claim-continue': read(); if (S.claimPick) go('verify'); return;
    case 'claim-finish': finishClaim(); return;
    case 'sheet-who': read(); S.sheet = 'who'; render(); return;
    case 'sheet-close': if (e.target === el) { S.sheet = null; render(); } return;
    case 'switch': switchTo(id); return;
    case 'org-toggle': read(); S.orgFilter[el.dataset.k] = !S.orgFilter[el.dataset.k]; render(); return;
    case 'follow': S.follows.includes(id) ? S.follows.splice(S.follows.indexOf(id),1) : S.follows.push(id); render(); return;
    case 'collab': toast(`"Let’s collaborate" threads without a listing are planned (decision 6 in the brief).`); return;
    case 'new': S.draft = { kind:el.dataset.k, category:'Technology', title:'', desc:'', qty:'', unit:'', urgency:'Normal', tags:'', cadence:'One-time' }; go('post'); return;
    case 'new-for': { const l = S.listings.find(x=>x.id===+id); S.draft = { kind:l.kind==='Need'?'Offer':'Need', category:l.category, title:'', desc:'', qty:l.qty||'', unit:l.unit||'', urgency:'Normal', tags:l.tags }; go('post'); return; }
    case 'd': S.draft[el.dataset.k] = el.dataset.v; read(); S.draft.kind = el.dataset.v; render(); return;
    case 'post': read(); if (!S.draft.title.trim()) { toast('Give it a title'); return; } postListing(S.draft); return;
    case 'close-listing': { const l = S.listings.find(x=>x.id===+id); l.status='Closed'; render(); toast('Closed'); return; }
    case 'sheet-ihave': S.sheet = { ihave:+id }; render(); return;
    case 'propose': S.sheet = null; propose(+el.dataset.need, +el.dataset.offer, ''); return;
    case 'respond': respond(+id, el.dataset.v==='1'); return;
    case 'complete': complete(+id); return;
    case 'log-occ': logOccurrence(+id); return;
    case 'end-agree': if (confirm('End this standing agreement?')) endAgreement(+id); return;
    case 'send': { const inp = document.getElementById('msg'); sendMsg(+id, inp.value); return; }
    case 'flt': read(); S.filter[el.dataset.k] = el.dataset.v; S.map.sel = null; S.map.selMatch = null; render(); return;
    case 'flt-thread': S.filter.threads[el.dataset.k] = !S.filter.threads[el.dataset.k]; render(); return;
    case 'flt-toggle': S.filtersOpen = !S.filtersOpen; render(); return;
    case 'flt-clear': S.filter = { ...S.filter, kind:'All', category:'', who:'All', radius:0 }; render(); return;
    case 'map-focus': { const m = S.matches.find(x=>x.id===+id); if (!m) return; S.map.selMatch = S.map.selMatch === m.id ? null : m.id; S.map.sel = null; if (S.map.selMatch) fitView(S.map, [ORG(S.listings.find(l=>l.id===m.need).ein), ORG(S.listings.find(l=>l.id===m.offer).ein)]); render(); const mp = document.querySelector('.map'); if (mp) mp.scrollIntoView({ block:'start', behavior:'smooth' }); return; }
    case 'map-pin': if (gesture.moved) return; S.map.sel = S.map.sel === id ? null : id; S.map.selMatch = null; render(); return;
    case 'map-cluster': { if (gesture.moved) return; const members = (el.dataset.members || '').split(',').map(ORG).filter(Boolean); const before = S.map.k; if (members.length) fitView(S.map, members); if (S.map.k < before * 1.8) { const c = members.reduce((a,o)=>[a[0]+PROJ.x(o.lon)/members.length, a[1]+PROJ.y(o.lat)/members.length],[0,0]); S.map.k = before; S.map.tx = MAP_W/2 - c[0]*before; S.map.ty = MAP_H/2 - c[1]*before; zoomAt(S.map, 2.2, MAP_W/2, MAP_H/2); } S.map.sel = null; S.map.selMatch = null; render(); return; }
    case 'map-zoom': { const v = el.dataset.v; if (v === 'fit') { S.map.k = 1; S.map.tx = 0; S.map.ty = 0; } else zoomAt(S.map, v === 'in' ? 1.6 : 1/1.6, MAP_W/2, MAP_H/2); render(); return; }
    case 'map-thread': if (gesture.moved) return; S.map.selMatch = S.map.selMatch === +id ? null : +id; S.map.sel = null; render(); return;
    case 'contact': toast(`Shared: ${S.user.name}, ${S.user.email}, (206) 555-0100`); return;
    case 'notif': { const n = S.notifs.find(x=>x.id===+id); n.read = true; if (n.ref.match) go('match', n.ref.match); else if (n.ref.listing) go('listing', n.ref.listing); return; }
  }
  render();
});
document.addEventListener('input', e => {
  if (e.target.id === 'flt-radius') { S.filter.radius = +e.target.value; const lbl = e.target.nextElementSibling; if (lbl) lbl.textContent = S.filter.radius ? S.filter.radius + ' mi' : 'any distance'; }
  if (e.target.id === 'claimq') { S.claimQuery = e.target.value; S.claimPick = null; const pos = e.target.selectionStart; render(); const el = document.getElementById('claimq'); el.focus(); el.setSelectionRange(pos,pos); }
  if (e.target.id === 'orgq') { S.orgFilter.q = e.target.value; const pos = e.target.selectionStart; render(); const el = document.getElementById('orgq'); el.focus(); el.setSelectionRange(pos,pos); }
  if (e.target.id === 'd-title') { S.draft.title = e.target.value; const pos = e.target.selectionStart; render(); const el = document.getElementById('d-title'); el.focus(); el.setSelectionRange(pos,pos); }
});
document.addEventListener('change', e => { if (e.target.id === 'flt-category') { S.filter.category = e.target.value; render(); } if (e.target.id === 'flt-radius') { S.filter.radius = +e.target.value; render(); } if (['cause','city'].includes(e.target.id)) { S.orgFilter[e.target.id] = e.target.value; render(); } if (['d-category','d-cadence','d-urgency','d-qty','d-unit','d-desc','d-tags'].includes(e.target.id)) { S.draft[e.target.id.slice(2)] = e.target.value; render(); } });
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'msg') { const id = +e.target.nextElementSibling.dataset.id; sendMsg(id, e.target.value); } });

// ---- Map gestures: drag to pan, pinch / wheel / double-tap to zoom ----------
const gesture = { pointers: new Map(), moved: false, last: null, pinchDist: 0, pinchMid: null, lastTap: 0 };
function svgPoint(svg, clientX, clientY){ const r = svg.getBoundingClientRect(); return [ (clientX - r.left) * MAP_W / r.width, (clientY - r.top) * MAP_H / r.height ]; }
document.addEventListener('pointerdown', e => {
  const svg = e.target.closest('#mapsvg'); if (!svg) return;
  gesture.pointers.set(e.pointerId, [e.clientX, e.clientY]); gesture.moved = false;
  if (gesture.pointers.size === 1) { gesture.last = [e.clientX, e.clientY]; gesture.travel = 0; svg.classList.add('dragging'); }
  if (gesture.pointers.size === 2) { const [a, b] = [...gesture.pointers.values()]; gesture.pinchDist = Math.hypot(a[0]-b[0], a[1]-b[1]); gesture.pinchMid = [(a[0]+b[0])/2, (a[1]+b[1])/2]; }
});
document.addEventListener('pointermove', e => {
  if (!gesture.pointers.has(e.pointerId)) return;
  const svg = document.getElementById('mapsvg'); if (!svg) return;
  gesture.pointers.set(e.pointerId, [e.clientX, e.clientY]);
  const r = svg.getBoundingClientRect(), unitsPerPx = MAP_W / r.width;
  if (gesture.pointers.size === 2) {
    const [a, b] = [...gesture.pointers.values()]; const d = Math.hypot(a[0]-b[0], a[1]-b[1]); const mid = [(a[0]+b[0])/2, (a[1]+b[1])/2];
    if (gesture.pinchDist > 0) { const [ux, uy] = svgPoint(svg, mid[0], mid[1]); zoomAt(S.map, d / gesture.pinchDist, ux, uy); S.map.tx += (mid[0] - gesture.pinchMid[0]) * unitsPerPx; S.map.ty += (mid[1] - gesture.pinchMid[1]) * unitsPerPx; clampView(S.map); }
    gesture.pinchDist = d; gesture.pinchMid = mid; gesture.moved = true; applyView(); return;
  }
  if (gesture.pointers.size === 1 && gesture.last) {
    const dx = e.clientX - gesture.last[0], dy = e.clientY - gesture.last[1];
    gesture.travel = (gesture.travel || 0) + Math.abs(dx) + Math.abs(dy); if (gesture.travel > 8) gesture.moved = true;
    if (S.map.k > 1) { S.map.tx += dx * unitsPerPx; S.map.ty += dy * unitsPerPx; clampView(S.map); applyView(); }
    gesture.last = [e.clientX, e.clientY];
  }
});
function endPointer(e){
  if (!gesture.pointers.has(e.pointerId)) return;
  gesture.pointers.delete(e.pointerId); const svg = document.getElementById('mapsvg');
  if (gesture.pointers.size === 0) {
    if (svg) svg.classList.remove('dragging');
    const now = Date.now();
    if (!gesture.moved && now - gesture.lastTap < 320 && svg) { const [ux, uy] = svgPoint(svg, e.clientX, e.clientY); zoomAt(S.map, 2, ux, uy); gesture.moved = true; gesture.lastTap = 0; save(); render(); return; }
    gesture.lastTap = gesture.moved ? 0 : now;
    if (gesture.moved) { save(); render(); }   // re-render so pin sizes/labels match the new zoom
    setTimeout(() => { gesture.moved = false; }, 0);
  } else { gesture.last = [...gesture.pointers.values()][0]; gesture.pinchDist = 0; }
}
document.addEventListener('pointerup', endPointer); document.addEventListener('pointercancel', endPointer);
document.addEventListener('wheel', e => {
  const svg = e.target.closest('#mapsvg'); if (!svg) return; e.preventDefault();
  const [ux, uy] = svgPoint(svg, e.clientX, e.clientY); zoomAt(S.map, Math.exp(-e.deltaY * 0.0015), ux, uy); applyView();
  clearTimeout(gesture.wheelT); gesture.wheelT = setTimeout(() => { save(); render(); }, 150);
}, { passive: false });

// Boot: if nothing saved, start the story at step 0.
if (!S.user && S.step === 0 && S.screen === 'signup') STEPS[0].enter();
render();
if (S.guideMin) document.getElementById('guide').classList.add('min');
</script>
