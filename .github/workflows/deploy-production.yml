# Press "Run workflow" in the Actions tab. Ships exactly the files of the last successful deploy of main to
# staging. A pull request that is on staging never goes to production; only merged code does.
name: Deploy to production

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  actions: read     # to find the last staging build and download its files

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  production:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://helpbook-alpha.azurewebsites.net
    steps:
      # The production database pauses after an idle hour; a knock now wakes it while the files download.
      - name: Wake the production site and its database
        run: curl -s -o /dev/null -m 5 https://helpbook-alpha.azurewebsites.net/health || true
      - name: Find the last successful staging deploy of main
        id: last
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Only a push to main: a pull request from a branch that happens to be called "main" doesn't count.
          run=$(gh run list -R "$GITHUB_REPOSITORY" --workflow deploy-staging.yml --event push --branch main --status success --limit 1 --json databaseId,headSha,displayTitle --jq '.[0]')
          [ -n "$run" ] || { echo "No successful staging deploy of main yet."; exit 1; }
          sha=$(echo "$run" | jq -r .headSha)
          # And the commit must really be on main: main is that commit, or is ahead of it.
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$sha...main" --jq .status)
          case "$status" in
            identical|ahead) ;;
            *) echo "Commit $sha is not on main (compare says: $status). Not shipping it."; exit 1 ;;
          esac
          echo "id=$(echo "$run" | jq -r .databaseId)" >> "$GITHUB_OUTPUT"
          echo "Shipping $sha: $(echo "$run" | jq -r .displayTitle)" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/download-artifact@v8
        with:
          name: site
          run-id: ${{ steps.last.outputs.id }}
          github-token: ${{ github.token }}
      # Production's own identity: it can deploy helpbook-alpha and nothing else (docs/OPERATIONS.md).
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy
        run: az webapp deploy -g helpbook-alpha -n helpbook-alpha --src-path site.zip --type zip --async false
      - name: Health check
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://helpbook-alpha.azurewebsites.net/health || true)
            echo "health: $code"; [ "$code" = "200" ] && exit 0; sleep 10
          done
          exit 1
