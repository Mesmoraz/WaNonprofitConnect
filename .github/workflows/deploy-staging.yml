# Every pull request is built and tested: the API tests, and the acceptance tests in app/e2e (checks on the PR). Every merge to main builds once and goes to
# staging. A pull request with the label "staging" goes to staging too, and again on each new push, until
# something else takes its place. "Deploy to production" ships the files of the last main deploy.
name: Deploy to staging

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write        # sign in to Azure with GitHub's token; no password is stored
  contents: read
  pull-requests: write   # comment on the PR that went to staging, and move the label

concurrency:
  group: build-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # Adding any label other than "staging" doesn't need a new build.
    if: github.event.action != 'labeled' || github.event.label.name == 'staging'
    runs-on: ubuntu-latest
    steps:
      # The staging database pauses after an idle hour and takes about a minute to wake, and the site waits for
      # it when it starts. A knock now wakes it while this build and the tests run. Only when this build goes to
      # staging: a knock on every pull request would spend the free database allowance for nothing.
      - name: Wake the staging site and its database
        if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'staging')
        run: curl -s -o /dev/null -m 5 https://helpbook-staging.azurewebsites.net/health || true
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Say which pull request this build is
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          TITLE: ${{ github.event.pull_request.title }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # A merge to main: the pull request that merged this commit, if there was one.
          if [ -z "$PR" ]; then
            PR=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/pulls" --jq '.[0].number // empty' 2>/dev/null || true)
            [ -n "$PR" ] && TITLE=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq .title 2>/dev/null || true)
          fi
          echo "VITE_BUILD_PR=$PR" >> "$GITHUB_ENV"
          # GITHUB_ENV takes one line per value.
          TITLE=$(printf '%s' "$TITLE" | tr -s '\r\n' ' ' | cut -c1-200)
          echo "VITE_BUILD_TITLE=$TITLE" >> "$GITHUB_ENV"
          echo "VITE_BUILD_SHA=$SHA" >> "$GITHUB_ENV"
          echo "VITE_BUILD_REPO=$GITHUB_REPOSITORY" >> "$GITHUB_ENV"
          echo "Build of ${PR:+PR #$PR, }commit ${SHA:0:7}"
      - name: Install the app
        working-directory: app
        run: npm ci
      - name: Check the roadmap and the change log
        run: node scripts/roadmap.js && node scripts/changelog.js --check
      - name: Lint the app
        working-directory: app
        run: npm run lint
      - name: Build the app
        working-directory: app
        run: npm run build
      - name: Test the API
        run: dotnet test tests/WaNonprofitConnect.Tests/WaNonprofitConnect.Tests.csproj -c Release
      - name: Publish the API with the app inside
        run: dotnet publish src/WaNonprofitConnect.Api -c Release -o publish
      # Only a build that goes to staging keeps site.zip (staging deploys it; production ships main's from the last
      # staging deploy). Saving one for every pull request filled the repo's 2 GB artifact storage on Oct 22.
      - name: Zip
        if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'staging')
        run: cd publish && zip -qr ../site.zip .
      - if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'staging')
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: site.zip
          retention-days: 30

  # The acceptance tests (app/e2e): the real app and API on a fresh SQL Server, driven like a person on a phone.
  # Nothing reaches staging, and so nothing reaches production, unless these pass.
  acceptance:
    if: github.event.action != 'labeled' || github.event.label.name == 'staging'
    runs-on: ubuntu-latest
    env:
      ASPNETCORE_ENVIRONMENT: Development      # dev sign-in, admin@localhost
      ASPNETCORE_URLS: http://localhost:5253
      Data__LoadOnStartup: 'false'             # the tests load a sample, not the whole IRS list
      BASE_URL: http://localhost:5253
    steps:
      # A throwaway SQL Server in this job's own container; nothing real. Its password is made up for this run
      # only. Started first, by hand rather than as a service, so it boots while everything below builds.
      - name: Start SQL Server
        run: |
          SA_PASSWORD="Accept-$(openssl rand -hex 12)-Tests!"
          echo "::add-mask::$SA_PASSWORD"
          echo "SA_PASSWORD=$SA_PASSWORD" >> "$GITHUB_ENV"
          echo "ConnectionStrings__Default=Server=localhost,1433;Database=helpbook_acceptance;User Id=sa;Password=$SA_PASSWORD;TrustServerCertificate=True" >> "$GITHUB_ENV"
          docker run -d --name sql -e ACCEPT_EULA=Y -e MSSQL_SA_PASSWORD="$SA_PASSWORD" -p 1433:1433 mcr.microsoft.com/mssql/server:2022-latest
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-
      # The browser is cached by Playwright's version, read from the lockfile.
      - name: Which Playwright
        id: pw
        run: echo "version=$(node -p "require('./app/package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Build the app and the API
        run: |
          # The app's packages and the .NET build at the same time. (The CLI doesn't reference the API, so both
          # are built.) The app is built last: it writes into the API's wwwroot, which must not change under
          # the .NET build.
          (cd app && npm ci) & npm_pid=$!
          (dotnet build src/WaNonprofitConnect.Api -c Release && dotnet build src/WaNonprofitConnect.Cli -c Release) & dotnet_pid=$!
          wait $npm_pid || exit 1
          wait $dotnet_pid || exit 1
          cd app && npm run build
      # Only the headless shell: the tests never open a visible browser.
      - name: Install the browser
        if: steps.pw-cache.outputs.cache-hit != 'true'
        working-directory: app
        run: npx playwright install --with-deps --only-shell chromium
      - name: Install the browser's system libraries (browser from the cache)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        working-directory: app
        run: npx playwright install-deps chromium
      - name: Wait for SQL Server
        run: |
          for i in $(seq 1 60); do
            docker exec sql /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$SA_PASSWORD" -Q "SELECT 1" > /dev/null 2>&1 && exit 0
            sleep 2
          done
          docker logs sql; exit 1
      - name: Start the API (it creates the tables)
        run: |
          nohup dotnet run --project src/WaNonprofitConnect.Api -c Release --no-build --no-launch-profile > api.log 2>&1 &
          for i in $(seq 1 60); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5253/health)" = "200" ] && exit 0; sleep 2
          done
          cat api.log; exit 1
      - name: Load 13 real organizations and their ZIP codes
        run: |
          dotnet run --project src/WaNonprofitConnect.Cli -c Release --no-build -- import-zips --file tests/acceptance/fixtures/zcta_sample.txt
          dotnet run --project src/WaNonprofitConnect.Cli -c Release --no-build -- import bmf --state WA --file tests/acceptance/fixtures/eo_wa_sample.csv
      - name: Run the acceptance tests
        working-directory: app
        run: npx playwright test
      - name: Which roadmap stories are covered
        if: always()
        run: node scripts/acceptance.js >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the report and the API log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: acceptance-report
          path: |
            app/playwright-report
            app/test-results
            api.log
          retention-days: 3    # clean-artifacts.yml deletes it after 3 days anyway

  staging:
    needs: [build, acceptance]
    # main always; a pull request only while it carries the "staging" label.
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'staging')
    runs-on: ubuntu-latest
    # One deploy to the staging site at a time, whoever it's for.
    concurrency:
      group: staging-site
      cancel-in-progress: false
    environment:
      name: staging
      url: https://helpbook-staging.azurewebsites.net
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: site
      # Staging's own identity, helpbook-github-staging: it can deploy helpbook-staging and nothing else.
      # Production uses a different one (docs/OPERATIONS.md).
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_STAGING_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy
        run: az webapp deploy -g helpbook-alpha -n helpbook-staging --src-path site.zip --type zip --async false
      - name: Health check
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://helpbook-staging.azurewebsites.net/health || true)
            echo "health: $code"; [ "$code" = "200" ] && exit 0; sleep 10
          done
          exit 1
      - name: Say what's on staging now
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # The "staging" label means "this is what's on staging", so only one PR keeps it.
          for n in $(gh pr list -R "$GITHUB_REPOSITORY" --label staging --json number --jq '.[].number'); do
            [ "$n" = "$PR" ] && continue
            gh pr edit "$n" -R "$GITHUB_REPOSITORY" --remove-label staging
            gh pr comment "$n" -R "$GITHUB_REPOSITORY" --body "Staging now has $([ -n "$PR" ] && echo "#$PR" || echo "\`main\`") instead of this PR. Add the **staging** label again to put this back."
          done
          if [ -n "$PR" ]; then
            gh pr comment "$PR" -R "$GITHUB_REPOSITORY" --body "On staging: https://helpbook-staging.azurewebsites.net (commit ${SHA:0:7}). It stays there until another PR is labeled **staging** or something merges to \`main\`."
          fi
